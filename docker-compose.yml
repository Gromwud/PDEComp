services:
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
    command: ["python", "clean_run_metrics.py", "all"]

  discover:
    build:
      context: ./discover
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app:/app/discover
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    working_dir: /app
    volumes:
      - .:/app
    command: ["python", "clean_run_metrics.py", "discover"]
